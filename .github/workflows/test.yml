# Verify supported Node.js releases across the major GitHub-hosted operating systems.
name: Cross-platform tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Tests require repository content but no write access or GitHub credentials.
permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Node.js ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22, 24]

    steps:
      # Check out the exact revision selected by the workflow event.
      - name: Check out repository
        uses: actions/checkout@v7

      # Install each supported Node.js runtime independently on every operating system.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      # Exercise filesystem, process, CLI, and isolated Git behavior.
      - name: Run tests
        run: npm test

      # Reject syntax errors in both extension entry points.
      - name: Check syntax
        run: npm run check
